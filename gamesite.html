<!DOCTYPE html>
<html lang="mn">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rhombit Custom Demo</title>


        <style>
            @font-face {
                font-family: "Main";
                src: url(Font\ -\ Header.ttf);
            }
        :root {
            --bg: #05030b;
            --bg2: #12091f;
            --panel: rgba(12, 10, 26, 0.8);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f6f7ff;
            --muted: #c9d0ef;
            --cyan: #49e3ff;
            --purple: #8f5bff;
            --pink: #ff46c8;
            --yellow: #ffd55a;
            --green: #68ff9a;
            --red: #ff697e;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Main", Helvetica, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg), #090512 45%, var(--bg2));
            overflow-x: hidden;
        }


        .video-bg,
        .video-overlay,
        .noise,
        .glow {
            position: fixed;
            inset: 0;
        }


        .video-bg {
            z-index: -4;
        }


        .video-overlay {
            z-index: -3;
            background:
            radial-gradient(circle at 20% 20%, rgba(73, 227, 255, 0.12), transparent 22%),
            radial-gradient(circle at 80% 10%, rgba(255, 70, 200, 0.14), transparent 18%),
            linear-gradient(to bottom, rgba(4, 2, 8, 0.55), rgba(4, 2, 8, 0.82));
        }


        .noise {
            z-index: -2;
            opacity: 0.14;
            background-image:
            linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
        }


        .glow {
            z-index: -1;
            background:
            radial-gradient(circle at 15% 15%, rgba(73, 227, 255, 0.16), transparent 20%),
            radial-gradient(circle at 85% 18%, rgba(255, 70, 200, 0.14), transparent 18%),
            radial-gradient(circle at 50% 75%, rgba(143, 91, 255, 0.16), transparent 24%);
            filter: blur(14px);
            animation: floatGlow 10s ease-in-out infinite alternate;
        }


        .video-bg iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.18);
            pointer-events: none;
            filter: blur(1.2px) saturate(1.12) brightness(0.28);
        }


        @keyframes floatGlow {
            from { transform: translateY(-8px); }
            to   { transform: translateY(14px); }
        }


        .start-screen,
        .winner-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(3, 2, 8, 0.82);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .mini-tag {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(73, 227, 255, 0.3);
            background: rgba(73, 227, 255, 0.1);
            color: #aaf3ff;
            font-size: 0.9rem;
        }


        h1,
        h2,
        h3 {
            margin: 0 0 12px;
        }


        .main-title {
            font-size: clamp(2.2rem, 6vw, 5rem);
            line-height: 1.05;
            margin-bottom: 12px;
            text-shadow: 0 0 24px rgba(73, 227, 255, 0.24);
        }


        .gradient {
            background: linear-gradient(90deg, #fff, #91edff 30%, #c6b7ff 65%, #ff91e7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }


        .lead {
            max-width: 680px;
            margin: 0 auto 18px;
            color: var(--muted);
            line-height: 1.75;
        }


        .feature-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }


        .pill {
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }


        button,
        .btn {
            appearance: none;
            border: none;
            cursor: pointer;
            display: inline-block;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            transition: transform 0.25s, opacity 0.25s, box-shadow 0.25s;
        }


        button:hover,
        .btn:hover {
            transform: translateY(-2px);
        }


        .primary {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            box-shadow: 0 12px 30px rgba(143, 91, 255, 0.35);
        }


        .ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }


        .page {
            position: relative;
            z-index: 2;
        }


        .card {
            padding: 24px;
            border-radius: 26px;
            background: var(--panel);
            margin: 20px;
            border: 1px solid var(--line);
            backdrop-filter: blur(8px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        }


        .small {
            font-size: 0.95rem;
            color: var(--muted);
        }


        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 24px;
        }


        .hero {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.08fr 0.92fr;
            gap: 24px;
            align-items: center;
        }


        section {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto 28px;
        }


        .section-head {
            margin-bottom: 18px;
        }


        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
        }


        .section-sub {
            max-width: 800px;
            color: var(--muted);
            line-height: 1.7;
        }


        .grid-2,
        .grid-3,
        .team {
            display: grid;
            gap: 18px;
        }


        .grid-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }


        .grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }


        .team {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }


        .member {
            text-align: center;
            transition: all 0.5s;
        }

        .member:hover{
            border: 1px solid white;
        }


        .avatar {
            width: 98px;
            height: 98px;
            margin: 0 auto 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, rgba(73, 227, 255, 0.22), rgba(255, 70, 200, 0.22));
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .s2 { 
            animation-delay: 0.8s; 
        }
        .s3 { 
            animation-delay: 1.6s; 
        }


        @media (max-width: 980px) {
            .hero,
            .grid-2,
            .grid-3,
            .team {
                grid-template-columns: 1fr;
            }

            .hero-art {
                min-height: 520px;
            }

            .pad-wrap {
                left: 50%;
                top: 18px;
                transform: translateX(-50%);
            }

            .logo{
                color: rgba(0, 0, 70);
                height: auto;
                display: flex;
                align-items: center;
                justify-self: center;
            }

            .nav-head{
                display: none;
            }
        }
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);

            background-size: 40px 40px;
            animation: grid 12s infinite linear;
        }
        @media (min-width:1250px) {
            .nav-2, .tinynav{
                display: none;
            }
        }
        @media (max-width: 1250px) {
            .nav-head, .tinynav{
                display: none;
            }
        }
        .nav-head a{
            text-decoration: none;
            color: white;
            border-radius: 0px;
            transition: all 0.5s;
        }
        .nav-head ul{
            list-style-type: none;
            display: flex;
            gap: 50px;
            justify-content: space-between;
        }
        .nav-head a:hover{
            font-size: larger;
            color:#090512;
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            font-weight: 800;
        }
        #header{
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-2 a{
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            text-align: center;
            border-radius: 0px;
            transition: all 0.5s;
        }
        .nav-2 ul{
            list-style-type: none;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .nav-2 a:hover{
            font-weight: 800;
        }
        a{
            text-decoration: none;
            color: white;
            text-align: center;
        }
        @keyframes grid{
            0%{
                background-position: 0 0;
            }
            100%{
                background-position: 40% 40%;
            }
        }
        </style>
    </head>
    <body>
        <div class="grid-bg"></div>
        <div class="video-bg">
            <iframe
                src="https://www.youtube.com/embed/1EJojKpnBWs?autoplay=1&mute=1&controls=0&loop=1&playlist=1EJojKpnBWs&modestbranding=1&playsinline=1"
                title="Dance Tap Background"
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        <div class="video-overlay"></div>
        <div class="noise"></div>
        <div class="glow"></div>
    </body>
</html>
